<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rondas de Seguridad</title>

    <link rel="icon" href="data:,">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f6f8;
        }

        .card {
            border: 0;
            border-radius: 16px;
        }

        #lectorQR {
            width: 100%;
            margin-top: 20px;
            overflow: hidden;
            border-radius: 12px;
        }

        .estado {
            margin-top: 15px;
        }

        .oculto {
            display: none;
        }

        .scanner-info {
            font-size: 14px;
            color: #6c757d;
            margin-top: 15px;
        }

    </style>

</head>


<body>


<div class="container py-5">

    <div
        class="card shadow-sm mx-auto"
        style="max-width: 500px;"
    >

        <div class="card-body text-center p-4">


            <div class="fs-1 mb-3">
                🛡️
            </div>


            <h2>
                Rondas de Seguridad
            </h2>


            <p class="text-muted">
                Sistema de control de rondas
            </p>


            <hr>


            <div class="alert alert-info">

                📱 Escanea el código QR del punto
                de control para iniciar la ronda.

            </div>


            <!-- BOTÓN ESCANEAR -->

            <button
                id="btnEscanear"
                type="button"
                class="btn btn-primary btn-lg w-100"
            >
                📷 ESCANEAR QR
            </button>


            <!-- BOTÓN DETENER -->

            <button
                id="btnDetener"
                type="button"
                class="btn btn-outline-danger w-100 mt-2 oculto"
            >
                DETENER CÁMARA
            </button>


            <!-- LECTOR -->

            <div id="lectorQR"></div>


            <!-- MENSAJE -->

            <div
                id="mensaje"
                class="estado"
            ></div>


            <div class="scanner-info">

                El QR debe pertenecer al sistema
                de Rondas de Seguridad.

            </div>


        </div>

    </div>

</div>


<!-- LIBRERÍA QR -->

<script
    src="https://unpkg.com/html5-qrcode"
></script>


<script>

    // ==============================================
    // ELEMENTOS
    // ==============================================

    const btnEscanear =
        document.getElementById("btnEscanear");

    const btnDetener =
        document.getElementById("btnDetener");

    const mensaje =
        document.getElementById("mensaje");


    let lector = null;

    let escaneando = false;

    let procesandoQR = false;


    // ==============================================
    // MENSAJES
    // ==============================================

    function mostrarMensaje(tipo, texto) {

        mensaje.className =
            "alert alert-" + tipo + " estado";

        mensaje.textContent =
            texto;
    }


    function limpiarMensaje() {

        mensaje.className =
            "estado";

        mensaje.textContent =
            "";
    }


    // ==============================================
    // VALIDAR QR
    // ==============================================

    function validarQR(textoQR) {

        try {

            const url =
                new URL(textoQR);


            // --------------------------------------
            // 1. EL QR DEBE SER DE NUESTRA WEB
            // --------------------------------------

            if (
                url.origin !==
                window.location.origin
            ) {

                throw new Error(
                    "Este QR no pertenece al sistema."
                );
            }


            // --------------------------------------
            // 2. DEBE ABRIR ronda.html
            // --------------------------------------

            if (
                !url.pathname.endsWith(
                    "/ronda.html"
                )
            ) {

                throw new Error(
                    "Este QR no es un punto de ronda válido."
                );
            }


            // --------------------------------------
            // 3. OBTENER PUNTO
            // --------------------------------------

            const punto =
                url.searchParams.get(
                    "punto"
                );


            if (!punto) {

                throw new Error(
                    "El QR no contiene un código de punto."
                );
            }


            const codigo =
                punto
                    .trim()
                    .toUpperCase();


            // --------------------------------------
            // 4. VALIDAR FORMATO
            //
            // P01
            // P02
            // P100
            // etc.
            // --------------------------------------

            const formato =
                /^P\d+$/;


            if (
                !formato.test(codigo)
            ) {

                throw new Error(
                    "El código del punto no es válido."
                );
            }


            return codigo;


        } catch (error) {

            throw new Error(
                error.message ||
                "Código QR no válido."
            );
        }
    }


    // ==============================================
    // QR DETECTADO
    // ==============================================

    async function qrDetectado(
        textoQR
    ) {

        if (procesandoQR) {

            return;
        }


        procesandoQR = true;


        try {

            const codigoPunto =
                validarQR(
                    textoQR
                );


            mostrarMensaje(
                "success",
                "✅ QR válido. Punto: " +
                codigoPunto
            );


            // --------------------------------------
            // DETENER CÁMARA
            // --------------------------------------

            await detenerScanner();


            // --------------------------------------
            // REDIRECCIONAR
            //
            // ronda.html hará la validación real
            // contra Firebase.
            // --------------------------------------

            setTimeout(
                function () {

                    window.location.href =
                        "ronda.html?punto=" +
                        encodeURIComponent(
                            codigoPunto
                        );

                },
                400
            );


        } catch (error) {

            mostrarMensaje(
                "danger",
                "❌ " +
                error.message
            );


            // Permitir intentar otro QR

            setTimeout(
                function () {

                    procesandoQR =
                        false;

                },
                1000
            );
        }
    }


    // ==============================================
    // INICIAR ESCÁNER
    // ==============================================

    async function iniciarScanner() {

        if (escaneando) {

            return;
        }


        limpiarMensaje();


        if (
            typeof Html5Qrcode ===
            "undefined"
        ) {

            mostrarMensaje(
                "danger",
                "No se pudo cargar el lector QR."
            );

            return;
        }


        lector =
            new Html5Qrcode(
                "lectorQR"
            );


        try {

            await lector.start(

                {
                    facingMode:
                        "environment"
                },

                {
                    fps: 10,

                    qrbox: {
                        width: 250,
                        height: 250
                    }
                },

                function (
                    decodedText
                ) {

                    qrDetectado(
                        decodedText
                    );
                },

                function () {

                    // Ignoramos errores normales
                    // mientras busca un QR.

                }

            );


            escaneando =
                true;


            btnEscanear.classList.add(
                "oculto"
            );


            btnDetener.classList.remove(
                "oculto"
            );


            mostrarMensaje(
                "info",
                "📷 Cámara activa. Apunta al código QR."
            );


        } catch (error) {

            console.error(
                "Error cámara:",
                error
            );


            mostrarMensaje(
                "danger",
                "No se pudo abrir la cámara. Revisa los permisos."
            );


            lector =
                null;
        }
    }


    // ==============================================
    // DETENER ESCÁNER
    // ==============================================

    async function detenerScanner() {

        if (
            lector &&
            escaneando
        ) {

            try {

                await lector.stop();

            } catch (error) {

                console.log(
                    "Scanner detenido."
                );
            }


            try {

                await lector.clear();

            } catch (error) {

                console.log(
                    "Lector limpiado."
                );
            }
        }


        escaneando =
            false;


        btnEscanear.classList.remove(
            "oculto"
        );


        btnDetener.classList.add(
            "oculto"
        );
    }


    // ==============================================
    // BOTONES
    // ==============================================

    btnEscanear.addEventListener(
        "click",
        iniciarScanner
    );


    btnDetener.addEventListener(
        "click",
        async function () {

            await detenerScanner();

            limpiarMensaje();
        }
    );


    // ==============================================
    // CERRAR CÁMARA AL SALIR
    // ==============================================

    window.addEventListener(
        "beforeunload",
        function () {

            if (
                lector &&
                escaneando
            ) {

                lector.stop()
                    .catch(
                        function () {}
                    );
            }
        }
    );

</script>


</body>

</html>
