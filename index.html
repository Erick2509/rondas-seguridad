<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12243a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Rondas"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icons/rondas-192.png"><link rel="stylesheet" href="/style.css"><title>Prevención</title></head><body><header><div><h1><img src="/icons/rondas-192.png" width="28" height="28" alt=""> Prevención</h1><p id="identity">Control de rondas de seguridad</p></div><div class="actions"><button id="install" hidden>Instalar aplicación</button></div></header><div id="network" class="notice" role="status" hidden></div><div id="notice" class="notice" role="alert" hidden></div><main class="narrow"><section id="loginBox"><form id="login" class="box"><h2>Acceso del agente</h2><label for="code">Código</label><input id="code" inputmode="numeric" pattern="[0-9]{1,6}" autocomplete="username" required placeholder="Ejemplo: 001"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" class="full">Ingresar</button><p class="muted">El administrador te entrega el código y la contraseña. Si olvidaste tu clave, solicita que la renueve.</p></form></section><section id="work" hidden><div class="row"><h2>Tu ronda</h2><button id="refresh" class="secondary">Actualizar</button></div><div id="active" class="card"></div><button id="scan" class="full">📷 Escanear QR</button><button id="stop" class="secondary full" hidden>Detener cámara</button><div id="reader"></div><h2>Fotografías pendientes</h2><div id="drafts"></div><div class="actions"><button id="changePassword" class="secondary">Cambiar contraseña</button><button id="logout" class="secondary">Cerrar sesión</button></div></section></main><footer>Rondas de Seguridad · Versión 2 · Horarios del servicio: Lima</footer><script type="module" src="/assets/agent.js"></script></body></html>
