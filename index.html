<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rondas de Seguridad</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>

    <div class="container py-5">

        <div class="card shadow-sm mx-auto" style="max-width: 500px;">

            <div class="card-body text-center">

                <div class="fs-1 mb-3">
                    🛡️
                </div>

                <h2>
                    Rondas de Seguridad
                </h2>

                <p class="text-muted">
                    Sistema de control de rondas
                </p>

                <hr>

                <div id="puntoSeleccionado"></div>

                <button class="btn btn-primary w-100 mt-3">
                    Iniciar ronda
                </button>

            </div>

        </div>

    </div>


    <script>

        const punto = sessionStorage.getItem("puntoActual");

        const elemento =
            document.getElementById("puntoSeleccionado");


        if (punto) {

            const datos = JSON.parse(punto);

            elemento.innerHTML = `
        <div class="alert alert-info">
            📍 Punto:
            <strong>${datos.nombre}</strong>
            <br>
            Código:
            <strong>${datos.codigo}</strong>
        </div>
    `;

        } else {

            elemento.innerHTML = `
        <div class="alert alert-warning">
            ⚠️ Primero debes escanear un QR.
        </div>
    `;

        }

    </script>

</body>

</html>
