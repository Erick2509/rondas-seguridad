<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#172b4d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rondas">
  <link rel="apple-touch-icon" href="/icons/rondas-192.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rondas de Seguridad</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f4f6f8}.card{border:0;border-radius:16px}
    #lectorQR{width:100%;margin-top:20px;overflow:hidden;border-radius:12px}
    #lectorQR video{width:100%!important;border-radius:12px}
    .estado{margin-top:15px}.oculto{display:none!important}
    .scanner-info{font-size:14px;color:#6c757d;margin-top:15px}
  </style>
</head>
<body>
<div class="container py-5">
  <div class="card shadow-sm mx-auto" style="max-width:500px">
    <div class="card-body text-center p-4">
      <div class="fs-1 mb-3">🛡️</div>
      <h2>Rondas de Seguridad</h2>
      <p class="text-muted">Sistema de control de rondas</p>
      <hr>
      <div id="infoRondaActiva" class="alert alert-success d-none text-start"></div>
      <div id="accionesRondaActiva" class="d-none mb-3">
        <button id="btnCancelarRonda" type="button" class="btn btn-outline-danger w-100">❌ CANCELAR RONDA</button>
      </div>
      <div class="alert alert-info">📱 Escanea el siguiente código QR del recorrido.</div>
      <button id="btnEscanear" type="button" class="btn btn-primary btn-lg w-100">📷 ESCANEAR QR</button>
      <button id="btnDetener" type="button" class="btn btn-outline-danger w-100 mt-2 oculto">DETENER CÁMARA</button>
      <div id="lectorQR"></div>
      <div id="mensaje" class="estado"></div>
      <div class="scanner-info">Mantén el código QR completamente visible dentro de la cámara.</div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDf8abFDocep8kEHa45IJ02r_nBY6X8ops",authDomain:"rondas-seguridad-63ba4.firebaseapp.com",projectId:"rondas-seguridad-63ba4",storageBucket:"rondas-seguridad-63ba4.firebasestorage.app",messagingSenderId:"924206639387",appId:"1:924206639387:web:2e730ce51c54cccb624bbe"};
const db=getFirestore(initializeApp(firebaseConfig));
const btnEscanear=document.getElementById("btnEscanear");
const btnDetener=document.getElementById("btnDetener");
const mensaje=document.getElementById("mensaje");
const infoRondaActiva=document.getElementById("infoRondaActiva");
const accionesRondaActiva=document.getElementById("accionesRondaActiva");
const btnCancelarRonda=document.getElementById("btnCancelarRonda");
let lector=null,escaneando=false,procesandoQR=false;

async function mostrarRondaActiva(){
  try{
    let r=JSON.parse(localStorage.getItem("rondaActiva")||sessionStorage.getItem("rondaActiva")||"null");
    if(!r?.rondaId)return;
    const snap=await getDoc(doc(db,"rondas",r.rondaId));
    if(!snap.exists()||snap.data().estado!=="EN_CURSO"){
      localStorage.removeItem("rondaActiva"); sessionStorage.removeItem("rondaActiva"); sessionStorage.removeItem("rondaActual"); return;
    }
    const d=snap.data();
    r.ultimoOrden=Number(d.ultimoOrden||r.ultimoOrden||0);
    r.ultimoPuntoCodigo=d.ultimoPuntoCodigo||r.ultimoPuntoCodigo||null;
    r.totalValidados=Number(d.totalValidados||0);
    localStorage.setItem("rondaActiva",JSON.stringify(r)); sessionStorage.setItem("rondaActiva",JSON.stringify(r));
    infoRondaActiva.classList.remove("d-none"); accionesRondaActiva.classList.remove("d-none");
    infoRondaActiva.innerHTML=`<strong>🔄 RONDA EN CURSO</strong><br>👮 ${r.agente?.nombre||d.agenteNombre||""}<br>🧭 Ronda ${r.tipoRonda||d.tipoRonda||""}<br>📍 Último QR: ${r.ultimoPuntoCodigo||"Inicio pendiente"}<br>🔢 Validados: ${r.totalValidados||0}`;
  }catch(e){console.error(e);}
}
mostrarRondaActiva();

btnCancelarRonda.addEventListener("click",async()=>{
  let r; try{r=JSON.parse(localStorage.getItem("rondaActiva")||sessionStorage.getItem("rondaActiva")||"null");}catch(e){}
  if(!r?.rondaId)return;
  if(!confirm("¿Seguro que deseas cancelar esta ronda? Quedará registrada como INCOMPLETA."))return;
  const motivo=(prompt("Motivo de cancelación (opcional):","")||"").trim();
  btnCancelarRonda.disabled=true;
  try{
    const fin=new Date(),inicio=new Date(r.inicio);
    await updateDoc(doc(db,"rondas",r.rondaId),{estado:"INCOMPLETA",cancelacionTimestamp:serverTimestamp(),horaCancelacionLocal:fin.toISOString(),duracionSegundos:Math.max(0,Math.round((fin-inicio)/1000)),motivoCancelacion:motivo});
    fetch("/api/notificar-ronda",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tipoEvento:"INCOMPLETA",rondaId:r.rondaId})}).catch(()=>{});
    localStorage.removeItem("rondaActiva"); sessionStorage.removeItem("rondaActiva"); sessionStorage.removeItem("rondaActual");
    alert("Ronda cancelada. Quedó registrada como INCOMPLETA."); location.reload();
  }catch(e){alert("No se pudo cancelar la ronda: "+(e.message||e));btnCancelarRonda.disabled=false;}
});

function mostrarMensaje(tipo,texto){
  mensaje.className="alert alert-"+tipo+" estado";
  mensaje.textContent=texto;
}
function limpiarMensaje(){mensaje.className="estado";mensaje.textContent="";}

function validarQR(textoQR){
  let url;
  try{url=new URL(textoQR);}catch(e){throw new Error("El contenido leído no es un QR válido del sistema.");}
  if(url.origin!==window.location.origin)throw new Error("Este QR no pertenece al sistema de rondas.");
  if(!url.pathname.endsWith("/ronda.html"))throw new Error("Este QR no corresponde a un punto de ronda.");
  const punto=url.searchParams.get("punto");
  if(!punto)throw new Error("El QR no contiene el código del punto.");
  const codigo=punto.trim().toUpperCase();
  if(!/^P\d+$/.test(codigo))throw new Error("El código del punto no tiene un formato válido.");
  return codigo;
}

async function qrDetectado(textoQR){
  if(procesandoQR)return;
  procesandoQR=true;
  try{
    const codigoPunto=validarQR(textoQR);
    mostrarMensaje("success","✅ QR válido. Punto: "+codigoPunto);
    await detenerScanner();
    window.location.href="ronda.html?punto="+encodeURIComponent(codigoPunto);
  }catch(error){
    mostrarMensaje("danger","❌ "+error.message);
    setTimeout(()=>{procesandoQR=false;},1000);
  }
}

async function iniciarScanner(){
  if(escaneando)return;
  limpiarMensaje();
  if(typeof Html5Qrcode==="undefined"){mostrarMensaje("danger","No se pudo cargar el lector QR.");return;}
  try{
    lector=new Html5Qrcode("lectorQR");
    const camaras=await Html5Qrcode.getCameras();
    if(!camaras||!camaras.length)throw new Error("No se encontró ninguna cámara.");
    let seleccionada=camaras[0].id;
    for(const c of camaras){
      const n=(c.label||"").toLowerCase();
      if(n.includes("back")||n.includes("rear")||n.includes("trasera")||n.includes("environment")){seleccionada=c.id;break;}
    }
    await lector.start(seleccionada,{fps:15,disableFlip:false},qrDetectado,()=>{});
    escaneando=true;procesandoQR=false;
    btnEscanear.classList.add("oculto");btnDetener.classList.remove("oculto");
    mostrarMensaje("info","📷 Cámara activa. Escanea el siguiente QR.");
  }catch(error){
    lector=null;escaneando=false;
    mostrarMensaje("danger","No se pudo abrir la cámara. "+(error.message||"Revisa los permisos."));
  }
}
async function detenerScanner(){
  if(lector&&escaneando){
    try{await lector.stop();}catch(e){}
    try{await lector.clear();}catch(e){}
  }
  escaneando=false;
  btnEscanear.classList.remove("oculto");btnDetener.classList.add("oculto");
}
btnEscanear.addEventListener("click",iniciarScanner);
btnDetener.addEventListener("click",async()=>{await detenerScanner();procesandoQR=false;limpiarMensaje();});
window.addEventListener("beforeunload",()=>{if(lector&&escaneando)lector.stop().catch(()=>{});});
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js")
      .catch(err => console.error("Service Worker:", err));
  });
}
</script>

</body>
</html>
