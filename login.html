<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Rondas de Seguridad</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f4f6f8;min-height:100vh;display:flex;align-items:center}
    .card{border:0;border-radius:18px;max-width:440px;width:100%}
  </style>
</head>
<body>
<div class="container">
  <div class="card shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="fs-1">🛡️</div>
        <h2>Rondas de Seguridad</h2>
        <p class="text-muted mb-0">Acceso administrativo</p>
      </div>
      <form id="formLogin">
        <label class="form-label" for="correo">Correo</label>
        <input id="correo" type="email" class="form-control form-control-lg mb-3" autocomplete="username" required>
        <label class="form-label" for="clave">Contraseña</label>
        <input id="clave" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
        <div id="mensaje" class="alert alert-danger d-none mt-3"></div>
        <button id="btnEntrar" class="btn btn-primary btn-lg w-100 mt-4" type="submit">INGRESAR</button>
      </form>
      <a href="index.html" class="btn btn-link w-100 mt-2">Volver al sistema de rondas</a>
    </div>
  </div>
</div>
<script type="module" src="js/login.js"></script>
</body>
</html>
