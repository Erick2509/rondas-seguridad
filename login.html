<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="/manifest-admin.json">
  <meta name="theme-color" content="#172b4d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Administración">
  <link rel="apple-touch-icon" href="/icons/admin-192.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Rondas de Seguridad</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:linear-gradient(180deg,#f7f8fb 0%,#eef2f7 100%);min-height:100vh;display:flex;align-items:center}
    .login-card{border:0;border-radius:24px;overflow:hidden;max-width:460px;width:100%}
    .login-top{background:#111827;padding:28px 22px;text-align:center}
    .login-top img{width:min(300px,78vw);max-height:76px;object-fit:contain;margin-bottom:14px}
    .login-top h2{color:#fff;font-weight:800;margin:0}
    .login-top p{margin:8px 0 0;color:#d1d5db}
    .login-body{padding:24px 24px 28px}
  </style>
</head>
<body>
<div class="container">
  <div class="card shadow login-card mx-auto">
    <div class="login-top">
      <img src="icons/logo-prevencion-recortado.png" alt="Prevención">
      <h2>Panel de administración</h2>
      <p>Ingresa para gestionar rondas, puntos QR y agentes.</p>
    </div>
    <div class="login-body">
      <form id="formLogin">
        <label class="form-label" for="correo">Correo</label>
        <input id="correo" type="email" class="form-control form-control-lg mb-3" autocomplete="username" required>
        <label class="form-label" for="clave">Contraseña</label>
        <input id="clave" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
        <div id="mensaje" class="alert alert-danger d-none mt-3"></div>
        <button id="btnEntrar" class="btn btn-primary btn-lg w-100 mt-4" type="submit">INGRESAR</button>
      </form>
    </div>
  </div>
</div>
<script type="module" src="js/login.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js")
      .catch(err => console.error("Service Worker:", err));
  });
}
</script>

</body>
</html>
