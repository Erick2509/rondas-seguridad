<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ronda de Seguridad</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="container py-5">

        <div class="card shadow-sm mx-auto" style="max-width: 500px;">

            <div class="card-body">

                <div class="text-center mb-4">
                    <div class="fs-1">🛡️</div>
                    <h2>Rondas de Seguridad</h2>
                    <p class="text-muted">
                        Registro de punto de control
                    </p>
                </div>

                <!-- Cargando -->
                <div id="cargando" class="text-center">
                    <div class="spinner-border"></div>
                    <p class="mt-3">
                        Verificando punto...
                    </p>
                </div>

                <!-- Información del punto -->
                <div id="resultado" class="d-none">

                    <div class="alert alert-success">

                        <h5>✅ Punto identificado</h5>

                        <hr>

                        <p class="mb-1">
                            <strong>Punto:</strong>
                            <span id="nombrePunto"></span>
                        </p>

                        <p class="mb-0">
                            <strong>Código:</strong>
                            <span id="codigoPunto"></span>
                        </p>

                    </div>

                    <hr>

                    <label for="codigoAgente" class="form-label">
                        👮 Código del agente
                    </label>

                    <input type="text" id="codigoAgente" class="form-control form-control-lg text-center"
                        placeholder="Ejemplo: 001" autocomplete="off">

                    <div id="mensaje" class="alert d-none mt-3"></div>

                    <button id="btnContinuar" class="btn btn-primary btn-lg w-100 mt-3">
                        CONTINUAR →
                    </button>

                </div>

                <!-- Error -->
                <div id="error" class="d-none">

                    <div class="alert alert-danger">

                        <h5>❌ Error</h5>

                        <p id="mensajeError" class="mb-0"></p>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script type="module" src="js/ronda.js"></script>

</body>

</html>
