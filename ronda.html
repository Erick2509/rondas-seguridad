<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ronda de Seguridad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="container py-5">
  <div class="card shadow-sm mx-auto" style="max-width:500px">
    <div class="card-body">
      <div class="text-center mb-4"><div class="fs-1">🛡️</div><h2>Rondas de Seguridad</h2><p class="text-muted">Validación del recorrido</p></div>
      <div id="infoPunto" class="alert alert-info">
        📍 <strong>Punto:</strong> <span id="codigoPunto">Cargando...</span><br>
        <small id="estadoPunto" class="text-muted">Verificando información...</small>
      </div>
      <div id="infoRonda" class="alert alert-success d-none"></div>
      <div id="formularioAgente">
        <label for="codigoAgente" class="form-label">👮 Código del agente</label>
        <input type="text" id="codigoAgente" class="form-control form-control-lg text-center" placeholder="Ejemplo: 001" autocomplete="off" inputmode="numeric">
        <div id="mensaje" class="alert d-none mt-3"></div>
        <button id="btnContinuar" type="button" class="btn btn-primary btn-lg w-100 mt-3">CONTINUAR →</button>
      </div>
      <div id="error" class="alert alert-danger d-none mt-3"><strong>❌ Error</strong><br><span id="mensajeError"></span></div>
    </div>
  </div>
</div>
<script type="module" src="js/ronda.js"></script>
</body>
</html>
