<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ronda de Seguridad</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="container py-5">

        <div class="card shadow-sm mx-auto" style="max-width: 500px;">

            <div class="card-body text-center">

                <h2 class="mb-4">🛡️ Rondas de Seguridad</h2>

                <div id="cargando">
                    <div class="spinner-border"></div>
                    <p class="mt-3">Verificando punto...</p>
                </div>

                <div id="resultado" class="d-none">

                    <div class="alert alert-success">

                        <h4>✅ Punto identificado</h4>

                        <hr>

                        <p class="mb-1">
                            <strong>Código:</strong>
                            <span id="codigoPunto"></span>
                        </p>

                        <p class="mb-0">
                            <strong>Lugar:</strong>
                            <span id="nombrePunto"></span>
                        </p>

                    </div>

                    <button class="btn btn-primary w-100" onclick="continuar()">
                        CONTINUAR →
                    </button>

                </div>

                <div id="error" class="d-none">

                    <div class="alert alert-danger">

                        <h4>❌ Error</h4>

                        <p id="mensajeError"></p>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script type="module" src="js/ronda.js"></script>

</body>

</html>
