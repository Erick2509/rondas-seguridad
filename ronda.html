<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#172b4d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rondas">
  <link rel="apple-touch-icon" href="/icons/rondas-192.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ronda de Seguridad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    body{background:linear-gradient(180deg,#f7f8fb 0%,#eef2f7 100%)}
    .round-card{border:0;border-radius:24px;overflow:hidden}
    .round-top{background:#111827;color:#fff;padding:24px 20px 18px;text-align:center}
    .round-top img{width:min(280px,78vw);max-height:70px;object-fit:contain;margin-bottom:14px}
    .round-top h2{margin:0;font-weight:800}
    .round-top p{margin:8px 0 0;color:#d1d5db}
  </style>
</head>
<body>
  <div class="container py-3 py-md-5">
    <div class="card shadow round-card mx-auto" style="max-width:560px">
      <div class="round-top">
        <img src="icons/logo-prevencion.png" alt="Prevención">
        <h2>Validación del recorrido</h2>
        <p>Confirma el agente y continúa con el punto escaneado.</p>
      </div>
      <div class="card-body p-4">
        <div id="infoPunto" class="alert alert-info">
          📍 <strong>Punto:</strong> <span id="codigoPunto">Cargando...</span><br>
          <small id="estadoPunto" class="text-muted">Verificando información...</small>
        </div>
        <div id="infoRonda" class="alert alert-success d-none"></div>
        <div id="formularioAgente">
          <label for="codigoAgente" class="form-label">👮 Código del agente</label>
          <input type="text" id="codigoAgente" class="form-control form-control-lg text-center"
              placeholder="Ejemplo: 001" autocomplete="off" inputmode="numeric">
          <div id="mensaje" class="alert d-none mt-3"></div>
          <button id="btnContinuar" type="button" class="btn btn-primary btn-lg w-100 mt-3">CONTINUAR →</button>
        </div>
        <div id="error" class="alert alert-danger d-none mt-3"><strong>❌ Error</strong><br><span id="mensajeError"></span></div>
        <div id="accionesError" class="d-none mt-3">
          <button id="btnEscanearNuevamente" type="button" class="btn btn-primary btn-lg w-100">📷 ESCANEAR NUEVAMENTE</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/ronda.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js")
      .catch(err => console.error("Service Worker:", err));
  });
}
</script>

</body>
</html>
