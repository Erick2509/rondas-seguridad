<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#172b4d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rondas">
  <link rel="apple-touch-icon" href="/icons/rondas-192.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Ronda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="container py-4">
  <div class="card shadow-sm mx-auto" style="max-width:600px">
    <div class="card-body">
      <div class="text-center mb-4"><div class="fs-1">🛡️</div><h2>Registrar Ronda</h2><p class="text-muted">Evidencia del punto de control</p></div>
      <div id="informacion" class="alert alert-info">Cargando información...</div>
      <div id="gps" class="alert alert-warning">📍 Obteniendo ubicación...</div>
      <div id="seccionFoto" class="d-none">
        <label for="foto" class="btn btn-primary btn-lg w-100">📷 TOMAR FOTOGRAFÍA</label>
        <input type="file" id="foto" accept="image/*" capture="environment" class="d-none">
      </div>
      <div id="vistaPrevia" class="d-none mt-4">
        <h5 class="mb-3">Evidencia</h5>
        <canvas id="canvas" class="img-fluid rounded border"></canvas>
        <div id="estado" class="alert alert-success mt-3">✅ Fotografía preparada</div>
        <button id="btnRegistrar" class="btn btn-success btn-lg w-100">✅ REGISTRAR PUNTO</button>
        <button id="btnCompartir" class="btn btn-primary btn-lg w-100 mt-2 d-none">📲 COMPARTIR EN WHATSAPP</button>
        <button id="btnSiguiente" class="btn btn-dark btn-lg w-100 mt-2 d-none">🔄 CONTINUAR RONDA</button>
      </div>
      <div id="error" class="alert alert-danger d-none mt-3"></div>
    </div>
  </div>
</div>
<script type="module" src="js/camara.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js")
      .catch(err => console.error("Service Worker:", err));
  });
}
</script>

</body>
</html>
