<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registrar Ronda</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/estilos.css"
    >
</head>

<body>

<div class="container py-4">

    <div
        class="card shadow-sm mx-auto"
        style="max-width: 600px;"
    >

        <div class="card-body">

            <div class="text-center mb-4">

                <div class="fs-1">🛡️</div>

                <h2>Registrar Ronda</h2>

                <p class="text-muted">
                    Evidencia del punto de control
                </p>

            </div>


            <!-- INFORMACIÓN -->

            <div
                id="informacion"
                class="alert alert-info"
            >
                Cargando información...
            </div>


            <!-- GPS -->

            <div
                id="gps"
                class="alert alert-warning"
            >
                📍 Obteniendo ubicación...
            </div>


            <!-- BOTÓN CÁMARA -->

            <div
                id="seccionFoto"
                class="d-none"
            >

                <label
                    for="foto"
                    class="btn btn-primary btn-lg w-100"
                >
                    📷 TOMAR FOTOGRAFÍA
                </label>

                <input
                    type="file"
                    id="foto"
                    accept="image/*"
                    capture="environment"
                    class="d-none"
                >

            </div>


            <!-- PREVISUALIZACIÓN -->

            <div
                id="vistaPrevia"
                class="d-none mt-4"
            >

                <h5 class="mb-3">
                    Evidencia
                </h5>

                <canvas
                    id="canvas"
                    class="img-fluid rounded border"
                ></canvas>


                <div
                    id="estado"
                    class="alert alert-success mt-3"
                >
                    ✅ Fotografía preparada
                </div>


                <button
                    id="btnRegistrar"
                    class="btn btn-success btn-lg w-100"
                >
                    ✅ REGISTRAR RONDA
                </button>


                <button
                    id="btnCompartir"
                    class="btn btn-primary btn-lg w-100 mt-2 d-none"
                >
                    📲 COMPARTIR EN WHATSAPP
                </button>

            </div>


            <!-- ERROR -->

            <div
                id="error"
                class="alert alert-danger d-none mt-3"
            ></div>

        </div>

    </div>

</div>


<script
    type="module"
    src="js/camara.js"
></script>

</body>

</html>
